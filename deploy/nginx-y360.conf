# Y360 Admin — публикация консоли через nginx с TLS и единым входом.
#
# Приложение слушает только локально (UI_HOST=127.0.0.1, порт 8080),
# наружу отдаёт nginx. Так порт 8080 можно закрыть совсем, а вход выполнять
# по HTTPS на именованном хосте — этого требует ADFS/OIDC.
#
# Установка (на сервере ner-sdkr05):
#   sudo cp deploy/nginx-y360.conf /etc/nginx/sites-available/y360-admin
#   sudo ln -s /etc/nginx/sites-available/y360-admin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ВАЖНО: существующий файл /etc/nginx/sites-enabled/yandex-audit — это аудит-сервис
# (проект 11), он слушает :80 как default_server. Его не трогаем.

server {
    listen 443 ssl;
    http2 on;
    server_name y360.kolmar.ru;

    # Сертификат внутреннего CA для y360.kolmar.ru
    ssl_certificate     /etc/ssl/certs/y360.kolmar.ru.crt;
    ssl_certificate_key /etc/ssl/private/y360.kolmar.ru.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Заголовки безопасности (консоль отдаёт данные сотрудников)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 32m;

    # Обычные запросы и статика NiceGUI
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket NiceGUI: страницы собираются именно через него,
    # без Upgrade/Connection консоль откроется пустой.
    location /_nicegui_ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Необязательно: перенаправление с http на https для того же имени.
# Можно включить, только если это не конфликтует с yandex-audit (тот слушает
# :80 как default_server, отдельный server_name конфликта не создаёт).
#
# server {
#     listen 80;
#     server_name y360.kolmar.ru;
#     return 301 https://$host$request_uri;
# }
