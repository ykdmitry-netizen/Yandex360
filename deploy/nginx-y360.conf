# Y360 Admin — публикация консоли через nginx с TLS и единым входом (ADFS).
#
# Приложение слушает 8080 и наружу напрямую не нужно: вход выполняется по HTTPS
# на именованном хосте (этого требует ADFS/OIDC), а порт 8080 можно закрыть.
#
# Установка (на сервере ner-sdkr05):
#   sudo cp deploy/nginx-y360.conf /etc/nginx/sites-available/y360-admin
#   sudo ln -s /etc/nginx/sites-available/y360-admin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ВАЖНО: /etc/nginx/sites-enabled/yandex-audit — аудит-сервис (проект 11),
# слушает :80 как default_server. Его не трогаем.

server {
    # nginx 1.24: http2 включается в listen (директива http2 on с 1.25)
    listen 443 ssl http2;
    server_name y360-admin.kolmar.local;

    # Сертификат внутреннего CA: wildcard *.kolmar.local (действует до 09.02.2028)
    ssl_certificate     /etc/ssl/certs/kolmar.crt;
    ssl_certificate_key /etc/ssl/private/kolmar.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Консоль отдаёт персональные данные — заголовки безопасности
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # IE11 не сохраняет куки от сайтов, которые считает «сторонними», без этого
    # заголовка — из-за этого вход через ADFS в IE срывался с «state не совпал».
    add_header P3P 'CP="CAO PSA OUR"' always;

    client_max_body_size 32m;

    # Обычные запросы, страница входа и обмен кода с ADFS
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket NiceGUI: страницы собираются именно через него,
    # без Upgrade/Connection консоль откроется пустой.
    location /_nicegui_ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Перенаправление с http на https (отдельный server_name, конфликта с
# yandex-audit нет — тот остаётся default_server на :80).
server {
    listen 80;
    server_name y360-admin.kolmar.local;
    return 301 https://$host$request_uri;
}
